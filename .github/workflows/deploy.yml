name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Build frontend
        env:
          VITE_API_BASE: https://bedivere.space/api
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy backend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "backend/"
          target: "/tmp/etf-deploy-stage/"
          strip_components: 0

      - name: Copy frontend dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend/dist/"
          target: "/tmp/etf-deploy-stage/frontend-dist/"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            STAGE=/tmp/etf-deploy-stage
            DEPLOY=/opt/etf-dashboard

            echo "=== 1. 备份当前版本 ==="
            if [ -d $DEPLOY/backend ]; then
              mv $DEPLOY/backend $DEPLOY/backend.bak.$(date +%Y%m%d_%H%M%S) 2>/dev/null || true
            fi
            if [ -d $DEPLOY/frontend ]; then
              mv $DEPLOY/frontend $DEPLOY/frontend.bak.$(date +%Y%m%d_%H%M%S) 2>/dev/null || true
            fi

            echo "=== 2. 部署新代码 ==="
            # STAGE 下的结构: $STAGE/backend/... 和 $STAGE/frontend-dist/...
            mv $STAGE/backend $DEPLOY/backend
            mv $STAGE/frontend-dist $DEPLOY/frontend
            # STAGE 目录本身可能还剩空目录，清理
            rmdir $STAGE 2>/dev/null || true

            echo "=== 3. venv 检查 ==="
            cd $DEPLOY/backend
            if [ ! -d venv ]; then
              echo "  venv 不存在，创建"
              python3.13 -m venv venv
            fi
            source venv/bin/activate
            pip install --quiet --upgrade pip
            pip install --quiet -r requirements.txt

            echo "=== 4. 跑 init_db（建表，IF NOT EXISTS） ==="
            python scripts/init_db.py

            echo "=== 5. 跑 migrate_holders（如果数据可用） ==="
            if [ -f $DEPLOY/data/etf_data.db ]; then
              HOLDER_COUNT=$(PGPASSWORD=EtfPass2026! psql -h localhost -U etf_user -d etf_db -t -c "SELECT COUNT(*) FROM etf_top_holders;" 2>/dev/null || echo 0)
              if [ "$HOLDER_COUNT" = "0" ]; then
                echo "  holders 表为空，开始迁移"
                SOURCE_SQLITE_PATH=$DEPLOY/data/etf_data.db python scripts/migrate_holders.py || echo "  迁移失败（可忽略）"
              else
                echo "  holders 表已有 $HOLDER_COUNT 条，跳过迁移"
              fi
            else
              echo "  无 SQLite 源文件（$DEPLOY/data/etf_data.db 不存在），跳过迁移"
            fi

            echo "=== 6. 重启 gunicorn ==="
            ps aux | grep "gunicorn.*wsgi:app" | grep -v grep | awk '{print $2}' | xargs -r kill 2>/dev/null || true
            sleep 3
            cd $DEPLOY/backend
            nohup gunicorn -w 2 -b 127.0.0.1:8000 'wsgi:app' > /tmp/gunicorn.log 2>&1 &
            sleep 5

            echo "=== 7. 等待 gunicorn 就绪 ==="
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
                echo "  gunicorn 在 ${i} 秒后启动"
                break
              fi
              sleep 1
            done

            echo "=== 8. 跑 11 项端到端验证 ==="
            python scripts/post_deploy_verify.py --base https://bedivere.space

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint || true
