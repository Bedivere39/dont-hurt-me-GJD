name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        env:
          VITE_API_BASE: https://bedivere.space/api
        run: |
          cd frontend
          npm run build

      - name: Deploy to server
        run: |
          # 设置权限
          sudo chmod -R 755 /opt/etf-dashboard
          sudo chown -R runner:runner /opt/etf-dashboard 2>/dev/null || true

          # 备份当前版本
          cp -r /opt/etf-dashboard/backend /opt/etf-dashboard/backend.bak 2>/dev/null || true
          cp -r /opt/etf-dashboard/frontend/dist /opt/etf-dashboard/frontend/dist.bak 2>/dev/null || true

          # 复制新版本
          cp -r backend /opt/etf-dashboard/
          cp -r frontend/dist /opt/etf-dashboard/frontend/

          # 重启后端服务
          sudo pkill -f gunicorn || true
          sleep 2
          cd /opt/etf-dashboard/backend
          source venv/bin/activate
          nohup gunicorn -w 2 -b 127.0.0.1:8000 'wsgi:app' > /tmp/gunicorn.log 2>&1 &

          # 等待 gunicorn 就绪（最多 30 秒）
          echo "等待 gunicorn 启动..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
              echo "  gunicorn 在 ${i} 秒后启动"
              break
            fi
            sleep 1
          done

          # 最终验证：跑完整的 10 项端到端检查
          echo "运行部署后验证..."
          python scripts/post_deploy_verify.py --base https://bedivere.space
          if [ $? -ne 0 ]; then
            echo "=== /tmp/gunicorn.log 尾部 ===" >> /tmp/deploy_error.log
            tail -50 /tmp/gunicorn.log >> /tmp/deploy_error.log
            exit 1
          fi

  lint:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint || true
